<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Abrir Eventixar</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f4f7fb;
        color: #12263a;
      }
      main {
        max-width: 360px;
        text-align: center;
      }
      h1 {
        font-size: 1.4rem;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 16px;
        line-height: 1.4;
        color: #4b5c6e;
      }
      a.button {
        display: inline-block;
        padding: 12px 18px;
        border-radius: 10px;
        background: #1b3a5f;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
      .hint {
        margin-top: 20px;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Eventixar</h1>
      <p id="status">Abriendo tu acceso…</p>
      <p>
        <a class="button" id="open" href="#">Abrir la app</a>
      </p>
      <p class="hint">
        Si no se abre, instalá Eventixar y tocá de nuevo el botón.
      </p>
    </main>
    <script>
      (function () {
        var parts = location.pathname.split('/').filter(Boolean);
        if (parts[0] !== 'join' || !parts[1]) {
          document.getElementById('status').textContent =
            'Este link de acceso no es válido.';
          document.getElementById('open').style.display = 'none';
          return;
        }

        var token = parts[1];
        var deeplink = 'eventixar://join/' + encodeURIComponent(token);
        var intent =
          'intent://join/' +
          encodeURIComponent(token) +
          '#Intent;scheme=eventixar;package=com.eventixar.eventixar;end';
        var isAndroid = /Android/i.test(navigator.userAgent);
        var target = isAndroid ? intent : deeplink;

        document.getElementById('open').href = deeplink;

        // Try to hand off to the installed app right away.
        window.location.replace(target);
      })();
    </script>
  </body>
</html>
